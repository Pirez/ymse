[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ymse"
version = "0.3.0"
requires-python = ">=3.13"
dependencies = [
    "lettermint>=1.0.2,<2",
    "loguru",
    "python-dotenv",
    "requests",
]

[tool.hatch.build.targets.wheel]
packages = ["ymse"]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=8",
    "ruff>=0.9",
]

[tool.ruff.lint]
extend-select = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
